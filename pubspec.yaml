name: ble_scanner
description: "ED-BT5 BLE device scanner."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2
dependencies:
  flutter:
    sdk: flutter
  flutter_blue_plus: ^2.3.12
  flutter_riverpod: ^3.3.2
  http: ^1.6.0
  permission_handler: ^11.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/bluetooth_logo.png
  min_sdk_android: 21
  remove_alpha_ios: true
